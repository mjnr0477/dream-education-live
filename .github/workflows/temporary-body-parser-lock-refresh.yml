name: Temporary body-parser lock refresh

on:
  push:
    branches:
      - security/body-parser-update

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/body-parser-update
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update vulnerable transitive dependency within compatible ranges
        run: npm update body-parser --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched body-parser version
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const item = lock.packages && lock.packages['node_modules/body-parser'];
          if (!item || !/^2\\.(4|[5-9]|[1-9][0-9]+)\\./.test(item.version)) {
            console.error('Expected body-parser 2.4.0 or newer in the 2.x line; found:', item && item.version);
            process.exit(1);
          }
          console.log('Patched body-parser:', item.version);
          NODE
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "security: update patched body-parser dependency"
          git push origin HEAD:security/body-parser-update
