name: GLI Foundation Verification

on:
  push:
    branches:
      - main
      - gli-safe-foundation-20260929
      - ultramodern-frontend-20260929
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/gli-command-center.js
      - run: node --check product/gli/learner_graph_engine.js
      - run: node --check product/gli/proactive_learning_engine.js
      - run: node --check product/gli/offline_sync_engine.js
      - run: node --check product/gli/platform_manifest.js
      - run: node --check product/gli/knowledge_intelligence_engine.js
      - run: node --check product/gli/credential_engine.js
      - run: node --check product/gli/tenant_engine.js
      - run: node --check product/gli/production_security.js
      - run: node --check product/gli/tenant_access.js
      - run: node --check product/gli/telemetry_engine.js
      - run: node --check product/gli/developer_api.js
      - run: node --check product/global_sources/router.js
      - run: node --check product/global_sources/providers/science.js
      - run: node --check product/global_sources/providers/biomedical.js
      - run: node --check product/global_sources/providers/data.js
      - run: node --check product/global_sources/providers/repositories.js
      - run: node --check product/source_engine.js
      - run: node --check product/cross_source_verifier.js
      - run: node -e "const {verifyCrossSourceEvidence}=require('./product/cross_source_verifier'); const s=[{provider:'nist',source_type:'official',title:'A',extract:'The speed of light in vacuum is 299792458 m/s.'},{provider:'openalex',source_type:'academic_research',title:'B',extract:'The speed of light in vacuum is 299792458 m/s.'}]; const r=verifyCrossSourceEvidence(s); if(r.supporting_relationships<1) process.exit(1); const c=verifyCrossSourceEvidence([...s,{provider:'web',source_type:'web_reference',title:'C',extract:'The speed of light in vacuum is not 299792458 m/s.'}]); if(c.conflicting_relationships<1) process.exit(1); console.log('Cross-source verification smoke test passed')"
      - run: node --check product/gli/gli_intelligence_service.js
      - run: node -e "for (const f of ['./product/gli/learner_graph_engine','./product/gli/proactive_learning_engine','./product/gli/offline_sync_engine','./product/gli/platform_manifest','./product/gli/knowledge_intelligence_engine','./product/gli/credential_engine','./product/gli/tenant_engine']) require(f); console.log('GLI modules load successfully')"
      - run: npm test
      - run: node -e "const {buildLearnerGraph}=require('./product/gli/learner_graph_engine'); const {generateProactiveActions}=require('./product/gli/proactive_learning_engine'); const p={overall:{weakest_subject:'Math'},patterns:{current_misconception_topics:['fractions'],recovered_topics:['algebra']},topics:{fractions:{current_state:'MISCONCEPTION'}}}; const g=buildLearnerGraph({learner_id:'ci'},p); const a=generateProactiveActions({learner:{active_subject:'Math'},profile:p}); if(!g.concept_nodes || !a.length || a[0].suggested_action!=='correct_then_reassess') process.exit(1); console.log('GLI behavior smoke test passed')"
