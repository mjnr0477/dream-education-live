name: GLI Foundation Verification

on:
  push:
    branches:
      - main
      - gli-safe-foundation-20260929
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --check server.js
      - run: node --check product/gli/learner_graph_engine.js
      - run: node --check product/gli/proactive_learning_engine.js
      - run: node --check product/gli/offline_sync_engine.js
      - run: node --check product/gli/platform_manifest.js
      - run: node --check product/gli/knowledge_intelligence_engine.js
      - run: node --check product/gli/credential_engine.js
      - run: node --check product/gli/tenant_engine.js
      - run: node --check product/gli/gli_intelligence_service.js
      - run: node -e "for (const f of ['./product/gli/learner_graph_engine','./product/gli/proactive_learning_engine','./product/gli/offline_sync_engine','./product/gli/platform_manifest','./product/gli/knowledge_intelligence_engine','./product/gli/credential_engine','./product/gli/tenant_engine']) require(f); console.log('GLI modules load successfully')"
      - run: node -e "const {buildLearnerGraph}=require('./product/gli/learner_graph_engine'); const {generateProactiveActions}=require('./product/gli/proactive_learning_engine'); const p={overall:{weakest_subject:'Math'},patterns:{current_misconception_topics:['fractions'],recovered_topics:['algebra']},topics:{fractions:{current_state:'MISCONCEPTION'}}}; const g=buildLearnerGraph({learner_id:'ci'},p); const a=generateProactiveActions({learner:{active_subject:'Math'},profile:p}); if(!g.concept_nodes || !a.length || a[0].suggested_action!=='correct_then_reassess') process.exit(1); console.log('GLI behavior smoke test passed')"
