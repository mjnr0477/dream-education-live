name: Dream Education Verification

on:
  push:
    branches:
      - main
      - build-01-learner-intelligence-safety
  pull_request:

jobs:
  node-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check product/gli/advanced_learner_intelligence.js
      - run: node --check product/gli/learning_method_intelligence.js
      - run: node --check product/gli/curriculum_intelligence.js
      - run: node --check product/gli/learning_portfolio_engine.js
      - run: node --check product/gli/platform_readiness.js
      - run: node --check public/app.js
      - run: node --check public/frontend-workspace.js
      - run: node --check public/nextgen-visual.js
      - run: npm test
