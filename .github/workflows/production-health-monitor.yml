name: Production health monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health-monitor.yml"
      - "server.js"
      - "public/index.html"
      - "public/app.js"
      - "public/offline.html"
      - "public/service-worker.js"
      - "public/manifest.webmanifest"
      - "scripts/health-endpoint-smoke-test.js"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live API, homepage, and critical Connect workspaces
        env:
          BASE_URL: https://dream-education-live-4.onrender.com
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL.replace(/\/$/, '');
          const requiredHealth = {
            success: true,
            status: 'ok',
            app: 'Dream Education',
            cache: 'enabled',
            // The endpoint reports configuration, not a live Supabase connectivity check.
            supabase: 'configured',
            learning_history: 'configured'
          };

          async function fetchText(url) {
            const response = await fetch(url, {
              signal: AbortSignal.timeout(10000),
              headers: { accept: 'text/html,application/javascript,application/json' }
            });
            if (!response.ok) {
              throw new Error(`${url} returned HTTP ${response.status}`);
            }
            return { response, text: await response.text() };
          }

          async function check() {
            const healthResult = await fetchText(`${base}/api/health`);
            let health;
            try {
              health = JSON.parse(healthResult.text);
            } catch {
              throw new Error('Health endpoint did not return valid JSON');
            }
            for (const [key, expected] of Object.entries(requiredHealth)) {
              if (health[key] !== expected) {
                throw new Error(`Health check failed: expected ${key}=${JSON.stringify(expected)}, got ${JSON.stringify(health[key])}`);
              }
            }

            const home = await fetchText(base + '/');
            const appAssetMatch = home.text.match(/<script[^>]+src=["']([^"']*\/app\.js(?:\?[^"']*)?)["']/i);
            if (!appAssetMatch) {
              throw new Error('Homepage does not reference the main app.js asset');
            }
            const appAssetUrl = new URL(appAssetMatch[1], base).toString();
            const app = await fetchText(appAssetUrl);
            const requiredUiContracts = [
              ['Meetings workspace export', /window\.DreamEducationMeetings\s*=\s*\{/],
              ['General Connections workspace export', /window\.DreamEducationConnections\s*=\s*\{/],
              ['Meetings click dispatcher', /if\s*\(action\s*===\s*"meetings"\)/],
              ['General Connections click dispatcher', /if\s*\(action\s*===\s*"general-connections"\)/],
              ['shared mobile menu helper', /window\.DreamEducationUI\s*=\s*\{[\s\S]*?setMenuOpen/]
            ];
            for (const [label, pattern] of requiredUiContracts) {
              if (!pattern.test(app.text)) {
                throw new Error(`Production app asset is missing: ${label}`);
              }
            }

            // Check the offline recovery assets as well as the online app shell.
            const [offlinePage, serviceWorker, manifestResult] = await Promise.all([
              fetchText(base + '/offline.html'),
              fetchText(base + '/service-worker.js'),
              fetchText(base + '/manifest.webmanifest')
            ]);
            if (!/need an internet connection/i.test(offlinePage.text)) {
              throw new Error('Offline fallback page is missing its connection guidance');
            }
            if (!/addAll\(SHELL_URLS\)/.test(serviceWorker.text) ||
                !/request\.mode === "navigate"/.test(serviceWorker.text) ||
                !/caches\.match\("\/offline\.html"\)/.test(serviceWorker.text)) {
              throw new Error('Production service worker is missing app-shell precache or navigation fallback behavior');
            }
            let manifest;
            try {
              manifest = JSON.parse(manifestResult.text);
            } catch {
              throw new Error('Production web manifest did not return valid JSON');
            }
            if (manifest.start_url !== '/' || manifest.display !== 'standalone') {
              throw new Error('Production web manifest has unexpected install/start settings');
            }

            console.log('Production smoke check passed:', JSON.stringify({
              app: health.app,
              cache: health.cache,
              supabase: health.supabase,
              learning_history: health.learning_history,
              homepage_status: home.response.status,
              app_asset: new URL(appAssetUrl).pathname + new URL(appAssetUrl).search,
              offline_fallback: offlinePage.response.status,
              service_worker: serviceWorker.response.status,
              install_manifest: manifestResult.response.status,
              connect_workspaces: 'Meetings and General Connections handlers present'
            }));
          }

          (async () => {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await check();
                return;
              } catch (error) {
                lastError = error;
                console.error(`Production smoke check attempt ${attempt}/3 failed:`, error.message);
                if (attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
            }
            console.error('Production smoke check failed after 3 attempts.');
            console.error(lastError?.message || 'Unknown health check error');
            process.exitCode = 1;
          })();
          NODE
