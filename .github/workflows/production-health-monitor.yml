name: Production health monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health-monitor.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live Dream Education health endpoint
        env:
          HEALTH_URL: https://dream-education-live-4.onrender.com/api/health
        run: |
          node <<'NODE'
          const url = process.env.HEALTH_URL;
          const required = {
            success: true,
            app: 'Dream Education',
            cache: 'enabled',
            supabase: 'enabled',
            learning_history: 'enabled'
          };

          async function check() {
            const response = await fetch(url, {
              signal: AbortSignal.timeout(10000),
              headers: { accept: 'application/json' }
            });
            if (!response.ok) {
              throw new Error(`Health endpoint returned HTTP ${response.status}`);
            }

            const body = await response.json();
            for (const [key, expected] of Object.entries(required)) {
              if (body[key] !== expected) {
                throw new Error(`Health check failed: expected ${key}=${JSON.stringify(expected)}, got ${JSON.stringify(body[key])}`);
              }
            }
            console.log('Production health check passed:', JSON.stringify({
              app: body.app,
              cache: body.cache,
              supabase: body.supabase,
              ai_mode: body.ai_mode,
              learning_history: body.learning_history
            }));
          }

          (async () => {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                await check();
                return;
              } catch (error) {
                lastError = error;
                console.error(`Health check attempt ${attempt}/3 failed:`, error.message);
                if (attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
            }
            console.error('Production health check failed after 3 attempts.');
            console.error(lastError?.message || 'Unknown health check error');
            process.exitCode = 1;
          })();
          NODE
