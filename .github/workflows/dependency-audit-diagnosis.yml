name: Dependency audit diagnosis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit-diagnosis.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > audit-report.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          const meta = report.metadata?.vulnerabilities || {};
          console.log('Audit totals:', JSON.stringify(meta));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via || []).map(v => typeof v === 'string' ? v : {
                title: v.title, url: v.url, range: v.range, severity: v.severity
              }),
              effects: item.effects
            }));
          }
          const blocking = ['critical', 'high'].reduce(
            (total, severity) => total + Number(meta[severity] || 0),
            0
          );
          if (blocking > 0) {
            console.error(`Dependency audit blocked: ${blocking} high/critical vulnerability finding(s).`);
            process.exitCode = 1;
          } else {
            console.log('Dependency audit gate passed: no high or critical vulnerabilities.');
          }
          NODE
