name: Dream Wi-Fi end-to-end readiness checks

on:
  pull_request:
    paths:
      - "server.js"
      - "product/dream_wifi_tunnel_engine.js"
      - "public/dream-wifi.html"
      - "public/dream-wifi-page.js"
      - "scripts/dream-wifi-*.js"
      - "android/dream-wifi-vpn/**"
      - ".github/workflows/dream-wifi-end-to-end-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check Dream Wi-Fi server and clients
        run: |
          node --check server.js
          node --check product/dream_wifi_tunnel_engine.js
          node --check public/dream-wifi-page.js
          node --check scripts/dream-wifi-source-agent.js
          node --check scripts/dream-wifi-proxy-client.js
          node --check scripts/dream-wifi-tunnel-control-smoke-test.js
          node --check scripts/dream-wifi-android-vpn-smoke-test.js
      - name: Verify authenticated TCP and UDP relay behavior
        run: node scripts/dream-wifi-tunnel-control-smoke-test.js
      - name: Verify Android VPN and dashboard readiness safeguards
        run: node scripts/dream-wifi-android-vpn-smoke-test.js
      - name: Run existing platform regression suite
        run: npm test
