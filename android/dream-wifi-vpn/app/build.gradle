plugins { id "com.android.application" }
android {
    namespace "com.dreameducation.wifi"
    compileSdk 35
    defaultConfig {
        applicationId "com.dreameducation.dreamwifi"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.3.1"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        externalNativeBuild { ndkBuild { arguments "APP_PLATFORM=android-26" } }
    }
    externalNativeBuild {
        ndkBuild {
            path file("hev-socks5-tunnel/Android.mk")
        }
    }
    ndkVersion "27.2.12479018"
}
