    namespace "com.dreameducation.wifi"
    compileSdk 35
    defaultConfig { applicationId "com.dreameducation.wifi"; minSdk 26; targetSdk 35; versionCode 1; versionName "0.1.0" }
    ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    externalNativeBuild {
        ndkBuild {
            path file("hev-socks5-tunnel/Android.mk")
            arguments "APP_PLATFORM=android-26"
        }
    }
    ndkVersion "27.2.12479018"
}
