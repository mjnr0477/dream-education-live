<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Education — Private Chat</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f7fb;
      color:#172033;
    }
    .wrap{
      max-width:900px;
      margin:auto;
      padding:20px;
    }
    .card{
      background:white;
      border-radius:18px;
      padding:20px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
      margin-bottom:18px;
    }
    h1{margin:0 0 8px}
    .secure{
      display:inline-block;
      padding:8px 12px;
      border-radius:999px;
      background:#e8f8ef;
      color:#137333;
      font-weight:bold;
      font-size:13px;
      margin-bottom:16px;
    }
    input,button{
      width:100%;
      padding:13px;
      border-radius:10px;
      border:1px solid #d7deea;
      font-size:15px;
    }
    button{
      cursor:pointer;
      background:#172033;
      color:white;
      border:0;
      font-weight:bold;
    }
    button:hover{opacity:.9}
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .users{
      display:grid;
      gap:8px;
      margin-top:12px;
    }
    .user{
      padding:13px;
      border:1px solid #dce3ee;
      border-radius:12px;
      cursor:pointer;
      background:#fafcff;
    }
    .user:hover{background:#eef4ff}
    .selected{
      border:2px solid #172033;
      background:#eef4ff;
    }
    #messages{
      height:380px;
      overflow-y:auto;
      border:1px solid #e0e5ed;
      border-radius:14px;
      padding:12px;
      background:#f9fbfd;
      margin:15px 0;
    }
    .msg{
      max-width:80%;
      padding:10px 13px;
      margin:8px 0;
      border-radius:14px;
      background:#e9eef6;
    }
    .mine{
      margin-left:auto;
      background:#172033;
      color:white;
    }
    .meta{
      font-size:11px;
      opacity:.65;
      margin-bottom:4px;
    }
    .empty{
      text-align:center;
      padding:40px 10px;
      color:#697386;
    }
    @media(max-width:600px){
      .row{grid-template-columns:1fr}
      .wrap{padding:12px}
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <span class="secure">🔐 End-to-end encryption active</span>
    <h1>Private Chat</h1>
    <p>Only people with an active Dream Education connection can chat with you.</p>

    <div class="row">
      <input id="name" placeholder="Your name">
      <input id="email" type="email" placeholder="Your email">
      <input id="phone" type="tel" placeholder="Your phone number">
      <button id="register">Connect My Dream Education Identity</button>
    </div>

    <p id="identityStatus"></p>
  </div>

  <div class="card">
    <h2>Choose a person</h2>
    <button id="refreshUsers">Refresh People</button>
    <div id="users" class="users">
      <div class="empty">No people loaded yet.</div>
    </div>
  </div>

  <div class="card">
    <h2 id="conversationTitle">No conversation selected</h2>
    <p id="verification"></p>

    <div id="messages">
      <div class="empty">Select a person to start a private conversation.</div>
    </div>

    <div class="row">
      <input id="messageInput" placeholder="Write an encrypted message..." disabled>
      <button id="sendButton" disabled>Send Encrypted Message</button>
    </div>
  </div>

</div>

<script>
"use strict";

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const registerButton = document.getElementById("register");
const refreshUsersButton = document.getElementById("refreshUsers");
const usersBox = document.getElementById("users");
const identityStatus = document.getElementById("identityStatus");
const conversationTitle = document.getElementById("conversationTitle");
const verification = document.getElementById("verification");
const messagesBox = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

let myUserId = "";
let myRole = "";

let myDisplayName =
  localStorage.getItem("dream_chat_display_name") || "";

let myEmail =
  localStorage.getItem("dream_chat_email") || "";

let myPhone =
  localStorage.getItem("dream_chat_phone") || "";

let accessToken =
  localStorage.getItem("dream_education_access_token") || "";

emailInput.value = myEmail;
phoneInput.value = myPhone;

let selectedUser = null;
let roomKey = null;
let conversationId = null;

nameInput.value = myDisplayName;

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

async function createRoomKey() {
  return crypto.subtle.generateKey(
    {name:"AES-GCM", length:256},
    true,
    ["encrypt","decrypt"]
  );
}

async function exportRoomKey(key) {
  return arrayBufferToBase64(
    await crypto.subtle.exportKey("raw", key)
  );
}

async function importRoomKey(encoded) {
  return crypto.subtle.importKey(
    "raw",
    base64ToArrayBuffer(encoded),
    {name:"AES-GCM"},
    false,
    ["encrypt","decrypt"]
  );
}

async function encryptMessage(text) {
  if (!roomKey) throw new Error("No encryption key.");

  const iv = crypto.getRandomValues(new Uint8Array(12));

  const encrypted = await crypto.subtle.encrypt(
    {name:"AES-GCM", iv},
    roomKey,
    new TextEncoder().encode(text)
  );

  return {
    ciphertext: arrayBufferToBase64(encrypted),
    iv: arrayBufferToBase64(iv)
  };
}

async function decryptMessage(ciphertext, iv) {
  try {
    const decrypted = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:new Uint8Array(base64ToArrayBuffer(iv))},
      roomKey,
      base64ToArrayBuffer(ciphertext)
    );

    return new TextDecoder().decode(decrypted);
  } catch {
    return "[Unable to decrypt this message]";
  }
}

function makeConversationId(a,b) {
  return [a,b].sort().join("__");
}

function authHeaders() {
  accessToken =
    localStorage.getItem("dream_education_access_token") || accessToken;

  return accessToken
    ? { Authorization: "Bearer " + accessToken }
    : {};
}

async function registerUserSilently() {
  accessToken =
    localStorage.getItem("dream_education_access_token") || "";

  if (!accessToken) return false;

  const response = await fetch("/api/chat/users", {
    method:"POST",
    headers:{
      ...authHeaders(),
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      display_name:
        localStorage.getItem("dream_chat_display_name") || "Dream Education User",
      phone:
        localStorage.getItem("dream_chat_phone") || ""
    })
  });

  const data = await response.json();

  if (!response.ok || !data.success) return false;

  myUserId = data.user.user_id;
  myRole = data.user.role;

  localStorage.setItem("dream_chat_user_id", myUserId);
  localStorage.setItem("dream_chat_role", myRole);

  identityStatus.textContent =
    "Connected as " +
    data.user.display_name +
    " (" +
    data.user.role +
    ")";

  return true;
}

async function registerUser() {
  accessToken =
    localStorage.getItem("dream_education_access_token") || "";

  if (!accessToken) {
    alert("Please sign in to Dream Education first.");
    return;
  }

  const displayName = nameInput.value.trim();

  if (!displayName) {
    alert("Enter your name first.");
    return;
  }

  myDisplayName = displayName;
  myEmail = emailInput.value.trim().toLowerCase();
  myPhone = phoneInput.value.trim();

  localStorage.setItem("dream_chat_display_name", myDisplayName);
  localStorage.setItem("dream_chat_email", myEmail);
  localStorage.setItem("dream_chat_phone", myPhone);

  const response = await fetch("/api/chat/users", {
    method:"POST",
    headers:{
      ...authHeaders(),
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      display_name:displayName,
      phone:myPhone
    })
  });

  const data = await response.json();

  if (!response.ok || !data.success) {
    alert(data.message || "Could not register.");
    return;
  }

  myUserId = data.user.user_id;
  myRole = data.user.role;

  localStorage.setItem("dream_chat_user_id", myUserId);
  localStorage.setItem("dream_chat_role", myRole);

  identityStatus.textContent =
    "You are signed in as " +
    data.user.display_name +
    " (" +
    data.user.role +
    ")";

  await loadUsers();
}

async function loadUsers() {
  accessToken =
    localStorage.getItem("dream_education_access_token") || "";

  if (!accessToken) {
    usersBox.innerHTML =
      '<div class="empty">Please open Chat from your signed-in Dream Education session.</div>';
    return;
  }

  const response = await fetch("/api/chat/users", {
    headers: authHeaders()
  });

  const data = await response.json();

  if (!response.ok || !data.success) {
    usersBox.innerHTML =
      '<div class="empty">' +
      (data.message || "Could not load connected people.") +
      '</div>';
    return;
  } {
  const response = await fetch("/api/chat/users", {
    headers: authHeaders()
  });
  const data = await response.json();

  usersBox.innerHTML = "";

  const others = (data.users || []).filter(
    user => user.user_id !== myUserId &&
            user.status === "active"
  );

  if (!others.length) {
    usersBox.innerHTML =
      '<div class="empty">No active connections are available for chat yet.</div>';
    return;
  }

  for (const user of others) {
    const item = document.createElement("div");
    item.className = "user";

    if (selectedUser?.user_id === user.user_id) {
      item.classList.add("selected");
    }

    item.textContent = user.display_name;

    item.onclick = () => selectUser(user);

    usersBox.appendChild(item);
  }
}

async function selectRecipientFromUrl() {
  const recipientId =
    new URLSearchParams(window.location.search).get("recipient");

  if (!recipientId) return;

  const response = await fetch("/api/chat/users", {
    headers: authHeaders()
  });
  const data = await response.json();

  if (!response.ok || !data.success) return;

  const user = (data.users || []).find(
    candidate => candidate.user_id === recipientId
  );

  if (user) {
    await selectUser(user);
  }
}

async function selectUser(user) {
  selectedUser = user;
  conversationId = makeConversationId(myUserId, user.user_id);

  const keyStorage =
    "dream_chat_key_" + conversationId;

  const existingKey =
    localStorage.getItem(keyStorage);

  if (existingKey) {
    roomKey = await importRoomKey(existingKey);
  } else {
    roomKey = await createRoomKey();

    const exported = await exportRoomKey(roomKey);

    localStorage.setItem(keyStorage, exported);
  }

  conversationTitle.textContent =
    "Private conversation with " + user.display_name;

  verification.textContent =
    "🔒 Conversation ID: " +
    conversationId +
    " — encrypted before leaving this device.";

  messageInput.disabled = false;
  sendButton.disabled = false;

  await loadMessages();
  await loadUsers();
}

async function loadMessages() {
  if (!conversationId || !roomKey) return;

  const response = await fetch(
    "/api/chat/messages?conversation_id=" +
    encodeURIComponent(conversationId) +
    "&recipient_id=" +
    encodeURIComponent(selectedUser.user_id) +
    "&recipient_role=" +
    encodeURIComponent(selectedUser.role)
  , {
    headers: authHeaders()
  });

  const data = await response.json();

  messagesBox.innerHTML = "";

  if (!data.messages?.length) {
    messagesBox.innerHTML =
      '<div class="empty">No messages yet. Your first message will be encrypted.</div>';
    return;
  }

  for (const message of data.messages) {
    const text = await decryptMessage(
      message.ciphertext,
      message.iv
    );

    const box = document.createElement("div");

    box.className =
      "msg " +
      (message.sender_id === myUserId ? "mine" : "");

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent =
      message.sender_id === myUserId
        ? "You"
        : selectedUser?.display_name || "Recipient";

    const body = document.createElement("div");
    body.textContent = text;

    box.appendChild(meta);
    box.appendChild(body);

    messagesBox.appendChild(box);
  }

  messagesBox.scrollTop = messagesBox.scrollHeight;
}

async function sendMessage() {
  const text = messageInput.value.trim();

  if (!text || !selectedUser || !roomKey) return;

  const encrypted = await encryptMessage(text);

  const response = await fetch("/api/chat/messages", {
    method:"POST",
    headers:{
      ...authHeaders(),
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      conversation_id:conversationId,
      recipient_id:selectedUser.user_id,
      recipient_role:selectedUser.role,
      ciphertext:encrypted.ciphertext,
      iv:encrypted.iv
    })
  });

  const data = await response.json();

  if (!response.ok || !data.success) {
    alert(data.message || "Message could not be sent.");
    return;
  }

  messageInput.value = "";

  await loadMessages();
}

registerButton.addEventListener("click", registerUser);
selectRecipientFromUrl().catch(error =>
  console.error("Recipient selection error:", error)
);
refreshUsersButton.addEventListener("click", async () => {
  await registerUserSilently();
  await loadUsers();
});

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

if (myDisplayName) {
  identityStatus.textContent =
    "Saved identity: " + myDisplayName;
}

registerUserSilently().then(loadUsers).catch(error =>
  console.error("Chat startup error:", error)
);

setInterval(() => {
  if (selectedUser) loadMessages();
}, 2000);
</script>

</body>
</html>
